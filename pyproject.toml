[project]
name = "myelin"
version = "0.1.0"
description = "Fast, time-fused spiking neural network simulation for PyTorch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.4",
    "torch>=2.13.0.dev0",
    "torchvision",
]
license = "MIT"

# torch 2.13 (for the associative_scan WKV path with working autograd) is only
# available as a nightly build, which is not published to PyPI. Pull torch and
# torchvision from the PyTorch nightly CUDA index. NOTE: pinned nightly dev
# builds are garbage-collected from the index after a few weeks; re-run
# `uv lock` if a sync fails, and switch this back to PyPI once 2.13 ships stable.
[tool.uv]
prerelease = "allow"
# Only resolve nightly builds that ship a wheel for this platform; otherwise uv
# may pick the very latest dev date before its x86_64 Linux wheel is published.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly", marker = "sys_platform == 'linux'" }

[project.optional-dependencies]
cuda = [
    "triton",
]
bench = [
    "numpy",
]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]
tracking = [
    "wandb",
]
cloud = [
    "modal",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not extended"]
markers = [
    "extended: slower integration, benchmark, or future-scope coverage that is not part of the default gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
