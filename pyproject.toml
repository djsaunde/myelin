[project]
name = "spiker"
version = "0.1.0"
description = "Fast, time-fused spiking neural network simulation for PyTorch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.4",
    "torch",
    "torchvision>=0.27.0",
]
license = "MIT"

[project.optional-dependencies]
cuda = [
    "triton",
]
bench = [
    "numpy",
]
dev = [
    "pyright",
    "pytest",
    "ruff",
]
tracking = [
    "wandb",
]
compare = [
    "snntorch>=0.9.4",
]
cloud = [
    "modal",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not extended"]
markers = [
    "extended: slower integration, benchmark, or future-scope coverage that is not part of the default gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportPrivateImportUsage = "none"
